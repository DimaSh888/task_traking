{% extends 'base.html' %}
{% block content %}
<section class="form-page">
<a class="back-link" href="{% url 'task-list' %}">← Back to tasks</a>
<div class="form-card"><p class="eyebrow">TASK</p><h1>{% if form.instance.pk %}Edit task{% else %}Create a new task{% endif %}</h1><p class="form-subtitle">Fill in the details below.</p>
<form method="post" class="styled-form">{% csrf_token %}{{ form.as_p }}<div class="action-row"><button type="submit" class="btn btn-primary">Save task</button><a class="btn btn-ghost" href="{% url 'task-list' %}">Cancel</a></div></form></div>
</section>
{% endblock %}
