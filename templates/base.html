{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}TaskFlow{% endblock %}</title>
</head>
<body>

<header class="site-header">
    <a class="brand" href="{% url 'task-list' %}">
        <span class="brand-mark">✓</span> TaskFlow
    </a>

    <nav class="header-actions">
        {% if request.user.is_authenticated %}
            <span class="user-name">Hi, {{ request.user.username }}</span>
            <a class="new-task-btn" href="{% url 'task-create' %}">+ New task</a>
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="logout-btn" type="submit">Logout</button>
            </form>
        {% else %}
            <a class="new-task-btn" href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
</header>

<main class="page-shell">
    {% block content %}{% endblock %}
</main>

</body>
</html>
